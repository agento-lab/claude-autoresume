name: test
on:
  pull_request:
  workflow_call:

# Declared explicitly. Without a permissions block these inherit the caller's,
# and Main grants contents:write + actions:write -- read is all this job needs.
permissions:
  contents: read

jobs:
  test:
    # macOS is not a preference here. The suite installs and uninstalls for
    # real, and the code under test uses launchd, osascript, BSD `stat -f`,
    # `date -r` and `sed -i ''`. None of that exists on Ubuntu.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install shell tooling
        run: brew install shellcheck shfmt jq

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: 0

      # Scoped to a throwaway HOME via CLAUDE_CONFIG_DIR / CLAUDE_AUTORESUME_DIR
      # and never registers the launchd agent, so it cannot touch the runner.
      - name: Run integration suite
        run: make test
