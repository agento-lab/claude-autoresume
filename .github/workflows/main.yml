name: Main

permissions:
  contents: write
  actions: write

# Two quick merges would otherwise run `auto shipit` concurrently and race on
# the tag. Releases are not cancelled in flight; the second waits.
concurrency:
  group: main-release
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # No `secrets: inherit` on these three -- they need no secret, and passing
  # every organisation secret into a job that installs 500-odd npm packages is
  # avoidable exposure.
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/test.yml
  scan:
    uses: ./.github/workflows/scan.yml
  release:
    needs: [lint, test, scan]
    uses: ./.github/workflows/release.yml
    secrets: inherit
