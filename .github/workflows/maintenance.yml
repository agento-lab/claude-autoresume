name: maintenance

permissions:
  issues: write
  pull-requests: write

on:
  schedule:
    - cron: '30 1 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 365
          days-before-pr-stale: 60
          days-before-close: 14
          exempt-pr-labels: sticky
          exempt-issue-labels: sticky
          delete-branch: true
          stale-issue-label: stale
          stale-issue-message: 'This issue is stale because it has been open 365 days with no activity. Remove stale label or comment or this will be closed in 14 days.'
          stale-pr-label: stale
          stale-pr-message: 'This PR is stale because it has been open 60 days with no activity. Remove stale label or comment or this will be closed in 14 days.'
          close-issue-message: 'This issue was closed because it has been stalled for 365 days with no activity.'
          close-pr-message: 'This PR was closed because it has been stalled for 60 days with no activity.'
